# Databricks Asset Bundle: deploys the notebooks and package, and creates the job.
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run manufacturing_etl -t dev
bundle:
  name: manufacturing-streaming-etl

include:
  - resources/*.yml

variables:
  storage_mode:
    description: volume (Unity Catalog volume, works on Free Edition) or adls (your own ADLS Gen2 account)
    default: volume
  catalog:
    default: workspace
  schema:
    default: default
  storage_account:
    description: ADLS Gen2 account (adls mode only)
    default: ""
  auth_mode:
    description: unity_catalog (recommended) or oauth (service principal via secret scope)
    default: unity_catalog

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace>.cloud.databricks.com  # your workspace URL
